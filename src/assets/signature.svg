<svg width="650" height="200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .animated-path {
      stroke: #333;
      stroke-width: 5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 2500;
      stroke-dashoffset: 2500;
      animation: draw 4s ease-in-out infinite;
    }
    
    @keyframes draw {
      0% {
        stroke-dashoffset: 2500;
      }
      80% {
        stroke-dashoffset: 0;
      }
      85% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: 2500;
      }
    }
    
    @media (prefers-color-scheme: dark) {
      .animated-path {
        stroke: #ccc;
      }
    }
  </style>
  
  <path 
    d="M 223 160 Q 148 85 73 100 Q 185.5 25 298 40 Q 260.5 25 223 160 Q 380.5 25 538 40 Q 365.5 25 193 100 Q 185.5 25 178 40 Q 320.5 25 463 160 Q 320.5 25 178 40" 
    class="animated-path"
  />
</svg>